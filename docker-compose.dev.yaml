# 開発専用 GUI ツール
# 本番環境では使用しないこと — DB/キャッシュへの直接アクセスはセキュリティリスク。
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#
# GUI ツール一覧:
#   pgAdmin 4       http://localhost:5050  (PostgreSQL)
#   RedisInsight     http://localhost:5540  (Redis)
#   MinIO Console    http://localhost:9001  (MinIO — 本体 compose に含まれる)

services:
  pgadmin:
    image: dpage/pgadmin4
    ports: ["5050:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ludiars.dev
      PGADMIN_DEFAULT_PASSWORD: ludiars
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes: [pgadmin-data:/var/lib/pgadmin]
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    ports: ["5540:5540"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgadmin-data:
