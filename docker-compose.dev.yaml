# 開発専用 GUI ツール
# 本番環境では使用しないこと — DB/キャッシュへの直接アクセスはセキュリティリスク。
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#
# GUI ツール一覧:
#   pgweb            http://localhost:8081  (PostgreSQL — セッションモードで全DB切替可能)
#   RedisInsight     http://localhost:5540  (Redis)
#   MinIO Console    http://localhost:9001  (MinIO — 本体 compose に含まれる)
#
# pgweb で DB を切り替える:
#   1. http://localhost:8081 を開く
#   2. 右上の接続情報をクリック → "New Connection"
#   3. Host: postgres, Port: 5432, User: ludiars, Password: ludiars, Database: cernere/curare/schedula

services:
  pgweb:
    image: sosedoff/pgweb
    ports: ["8081:8081"]
    command: [
      "/usr/bin/pgweb",
      "--bind=0.0.0.0",
      "--listen=8081",
      "--sessions"
    ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    ports: ["5540:5540"]
    depends_on:
      redis:
        condition: service_healthy
