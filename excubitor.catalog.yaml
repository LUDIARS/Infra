# Excubitor catalog fragment (Infra)
# 集積仕様: Excubitor catalog/FRAGMENTS.md (services.yaml > fragment > auto)
#
# 共有 DB は Mac 上で 127.0.0.1 にのみ bind し、どのネットワークにも出さない。
# Windows 側からは SSH ポートフォワードで 127.0.0.1:<port> として見せる。
# このトンネルが落ちると DB を参照する全サービスが起動不能になるため、
# infra tier + restart_policy always で Excubitor に監視させる。
services:
  - code: mac-db-tunnel
    name: Mac DB tunnel (postgres / redis / Infisical)
    tier: infra
    project_code: infra
    component: tunnel
    port: 5432
    repo: LUDIARS/Infra
    runtime: node
    cwd: ${ARS_ROOT}/infra
    command: node --env-file-if-exists=.env.mac-tunnel scripts/mac-migration/mac-tunnel.mjs
    allow_hot_reload: false
    autostart: true
    restart_policy: always
    max_restart: 5
    # 接続先ホストとログイン名は公開リポに置かず、未追跡の .env.mac-tunnel に書く
    # (MAC_TUNNEL_HOST / MAC_TUNNEL_USER)。未設定なら mac-tunnel.mjs が exit 2 で止まる。
    env:
      MAC_TUNNEL_PORTS: 5432,6379,8931
    health:
      # pid 生存ではなく実際に 5432 が転送されているかを見る。
      # ssh プロセスが生きたままフォワードだけ死ぬ状態を検知するため。
      type: tcp
      interval_sec: 30
      grace_period_sec: 15

  # 本社の共有キャッシュ (Garnet, RESP 互換)。 用途は TTL 付きキャッシュのみ。
  # 版固定・キー規約・無認証の判断は spec/feature/garnet-shared-cache.md。
  # バイナリは `node scripts/garnet/setup.mjs` で .local/ に展開する (git 管理外)。
  # 6379 は mac-db-tunnel が Mac の Redis 転送に使うため、 garnet は 6380 に置く。
  - code: garnet
    name: Garnet (HQ shared cache)
    tier: infra
    project_code: infra
    component: cache
    port: 6380
    repo: LUDIARS/Infra
    runtime: app
    app_kind: native
    exec: ${ARS_ROOT}/infra/.local/garnet/2.1.8/net8.0/GarnetServer.exe
    # 第 1 段階は loopback のみ・無認証 (Excubitor の exec_args に Vault 値を展開できないため)。
    # -m の既定は 16g なので必ず小さく固定する。
    exec_args:
      - --bind
      - 127.0.0.1
      - --port
      - "6380"
      - -m
      - 256m
      - -i
      - 64m
      - --logger-level
      - Warning
    process_match: GarnetServer.exe
    autostart: true
    restart_policy: on-failure
    max_restart: 5
    health:
      type: tcp
      interval_sec: 30
      grace_period_sec: 10
    # REDIS_URL (Mac の Redis) と名前を分ける。 localhost は ::1 に解決され得るので IP で書く。
    provides:
      GARNET_URL: redis://127.0.0.1:6380

  # 本社で共有 Postgres (AWS) を見るための Web ビューア (pgweb)。
  # 版固定・読み取り専用・loopback の判断は spec/feature/pgweb-hq-viewer.md。
  # バイナリは `node scripts/pgweb/setup.mjs` で .local/ に展開する (git 管理外)。
  # 接続情報は設定に持たず永続保存しない。 開いた人が画面のフォームで毎回入力する (--sessions でブラウザごとに分ける)。
  - code: pgweb
    name: pgweb (HQ Postgres viewer)
    tier: infra
    project_code: infra
    component: db-viewer
    port: 8081
    repo: LUDIARS/Infra
    runtime: app
    app_kind: native
    exec: ${ARS_ROOT}/infra/.local/pgweb/0.17.0/pgweb.exe
    exec_args:
      - --bind=127.0.0.1
      - --listen=8081
      - --sessions
      - --readonly
      - --no-ssh
      - --skip-open
    process_match: pgweb.exe
    autostart: true
    restart_policy: on-failure
    max_restart: 5
    health:
      type: tcp
      interval_sec: 30
      grace_period_sec: 10
